<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
<link rel="stylesheet" href="./responsive.css">
<link rel="stylesheet" href="./animations.css">
<script src="./site-animations.js" defer></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Open+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>*{box-sizing:border-box}</style>
</helmet>
<section aria-label="Work in motion" style="background:#FFFFFF;overflow:hidden;font-family:'Open Sans',Helvetica,Arial,sans-serif;font-weight:300">
  <div style="max-width:1320px;margin:0 auto;padding:clamp(56px,7vw,100px) 24px;display:grid;gap:clamp(28px,3.4vw,44px)">
    <div style="display:grid;gap:14px;max-width:38em">
      <h2 style="margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-weight:400;font-style:italic;color:#C6A15B;font-size:clamp(28px,4vw,48px);line-height:1.14">Work in Motion</h2>
      <p style="margin:0;font-size:16px;color:#000000">Installation and commissioning footage from live sites, recorded by our own engineers.</p>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:clamp(14px,1.8vw,24px)">
      <figure style="margin:0;position:relative;border-radius:26px;overflow:hidden;background:#FDFBF6;outline:1px solid rgba(23,74,139,0.08);outline-offset:-1px;transition:transform 400ms ease,outline-color 400ms ease" style-hover="transform:translateY(-8px);outline-color:#C6A15B">
        <video src="assets/vedios/vedio%201.mp4" muted="{{ true }}" playsInline="{{ true }}" loop="{{ true }}" autoPlay="{{ true }}" disableRemotePlayback="{{ true }}" onPlay="{{ mute }}" onVolumeChange="{{ mute }}" onLoadedData="{{ mute }}" preload="metadata" aria-label="Elevator installation work in progress" style="width:100%;aspect-ratio:9/16;object-fit:cover;display:block"></video>
        <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,29,58,0) 55%,rgba(7,29,58,0.85) 100%);pointer-events:none"></div>
      </figure>
      <figure style="margin:0;position:relative;border-radius:26px;overflow:hidden;background:#FDFBF6;outline:1px solid rgba(23,74,139,0.08);outline-offset:-1px;transition:transform 400ms ease,outline-color 400ms ease" style-hover="transform:translateY(-8px);outline-color:#C6A15B">
        <video src="assets/vedios/vedio%202.mp4" muted="{{ true }}" playsInline="{{ true }}" loop="{{ true }}" autoPlay="{{ true }}" disableRemotePlayback="{{ true }}" onPlay="{{ mute }}" onVolumeChange="{{ mute }}" onLoadedData="{{ mute }}" preload="metadata" aria-label="Elevator cabin running in a completed shaft" style="width:100%;aspect-ratio:9/16;object-fit:cover;display:block"></video>
        <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,29,58,0) 55%,rgba(7,29,58,0.85) 100%);pointer-events:none"></div>
      </figure>
      <figure style="margin:0;position:relative;border-radius:26px;overflow:hidden;background:#FDFBF6;outline:1px solid rgba(23,74,139,0.08);outline-offset:-1px;transition:transform 400ms ease,outline-color 400ms ease" style-hover="transform:translateY(-8px);outline-color:#C6A15B">
        <video src="assets/vedios/vedio%203.mp4" muted="{{ true }}" playsInline="{{ true }}" loop="{{ true }}" autoPlay="{{ true }}" disableRemotePlayback="{{ true }}" onPlay="{{ mute }}" onVolumeChange="{{ mute }}" onLoadedData="{{ mute }}" preload="metadata" aria-label="Elevator doors operating after commissioning" style="width:100%;aspect-ratio:9/16;object-fit:cover;display:block"></video>
        <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,29,58,0) 55%,rgba(7,29,58,0.85) 100%);pointer-events:none"></div>
      </figure>
      <figure style="margin:0;position:relative;border-radius:26px;overflow:hidden;background:#FDFBF6;outline:1px solid rgba(23,74,139,0.08);outline-offset:-1px;transition:transform 400ms ease,outline-color 400ms ease" style-hover="transform:translateY(-8px);outline-color:#C6A15B">
        <video src="assets/vedios/vedio%204.mp4" muted="{{ true }}" playsInline="{{ true }}" loop="{{ true }}" autoPlay="{{ true }}" disableRemotePlayback="{{ true }}" onPlay="{{ mute }}" onVolumeChange="{{ mute }}" onLoadedData="{{ mute }}" preload="metadata" aria-label="Elevator machine room and controller in operation" style="width:100%;aspect-ratio:9/16;object-fit:cover;display:block"></video>
        <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,29,58,0) 55%,rgba(7,29,58,0.85) 100%);pointer-events:none"></div>
      </figure>
    </div>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1320,&quot;height&quot;:720}}">class Component extends DCLogic {
  mute = (e) => {
    const v = e && e.currentTarget;
    if (!v) return;
    v.muted = true; v.defaultMuted = true; v.volume = 0;
    const at = v.audioTracks;
    if (at) { for (let i = 0; i < at.length; i++) at[i].enabled = false; }
  };
  componentDidMount() {
    this._m = () => document.querySelectorAll('video:not([data-vs-allow-sound])').forEach(v => {
      v.muted = true; v.volume = 0;
      if (v.paused && v.autoplay) { const p = v.play(); if (p && p.catch) p.catch(() => {}); }
    });
    this._m();
    this._iv = setInterval(this._m, 5000);
  }
  componentWillUnmount() { clearInterval(this._iv); }
  renderVals() { return { mute: this.mute }; }
}</script>
</body>
</html>
