<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
<link rel="stylesheet" href="./responsive.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
<style>
.vs-float-wrap{position:fixed;right:20px;bottom:20px;z-index:900;display:flex;flex-direction:column;align-items:center;gap:12px}
.vs-back-to-top{position:fixed;left:20px;bottom:20px;z-index:900;width:52px;height:52px;border-radius:50%;border:1px solid #C6A15B;background:#0B0B0C;color:#C6A15B;font-size:17px;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.vs-whatsapp{width:58px;height:58px;border-radius:50%;background:#25D366;color:#ffffff;font-size:29px;display:flex;align-items:center;justify-content:center;text-decoration:none;box-shadow:0 6px 18px rgba(5,80,40,0.35);flex-shrink:0}
@media (max-width:600px){
  .vs-float-wrap{right:14px;bottom:14px}
  .vs-back-to-top{left:14px;bottom:14px;width:42px;height:42px;font-size:15px}
  .vs-whatsapp{width:48px;height:48px;font-size:24px}
}
</style>
</helmet>
<div>
  <sc-if value="{{ scrolled }}" hint-placeholder-val="{{ false }}">
    <button type="button" aria-label="Back to top" onClick="{{ toTop }}" class="vs-back-to-top" style-hover="background:#C6A15B;color:#0B0B0C">
      <i class="fas fa-arrow-up"></i>
    </button>
  </sc-if>
  <div class="vs-float-wrap">
    <a href="https://wa.me/919148780701" target="_blank" rel="noopener" aria-label="Chat with us on WhatsApp" class="vs-whatsapp" style-hover="background:#1EBE5A">
      <i class="fab fa-whatsapp"></i>
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:200,&quot;height&quot;:200}}">
class Component extends DCLogic {
  state = { scrolled: false };
  componentDidMount() {
    this._s = () => {
      const y = window.scrollY || document.documentElement.scrollTop || 0;
      const on = y > 300;
      if (on !== this.state.scrolled) this.setState({ scrolled: on });
    };
    window.addEventListener('scroll', this._s, { passive: true });
    this._s();
  }
  componentWillUnmount() { window.removeEventListener('scroll', this._s); }
  renderVals() {
    return {
      scrolled: this.state.scrolled,
      toTop: () => window.scrollTo({ top: 0, behavior: 'smooth' })
    };
  }
}
</script>
</body>
</html>
